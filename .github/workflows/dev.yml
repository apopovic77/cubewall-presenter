name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    # GitHub-hosted runners are disabled for this account; use the own arkserver runner.
    runs-on: [self-hosted, linux, arkserver]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Run build
        run: npm run build
